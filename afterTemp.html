<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet"/>
    <title>Hymn of Daedalus</title>
</head>
<body>
    <header>Hymn of Daedalus</header>
    <section>
        <label>Aura</label>
        <progress class="Aura" value="67" max="100"></progress>
    </section>

    <!--Mid Story-->
    <section id="story"></section>
    <section id="choices"></section>
    <!--End of Midstory-->

        <section>
            <section class="Inventory"></section>
            <section class="Inventory"></section>
            <section class="Inventory"></section>
            <section class="Inventory"></section>
            <section class="Inventory"></section>
        </section>



<script>
const storyCont = document.getElementById("story")
const choiceCont = document.getElementById("choices")
const myStory = ['afterTemp']

const story = {
        afterTemp : {
            text : "The dark knight kneels and slowly fades away, leaving behind the armour and weapon. The armour and weapon are not in a shape where you can use for yourself. You grab the nearly broken helmet to take as proof. You head back to the village and the hut next to the board awards you with 10 gold coins. With money taken care of, you still need more experience before you feel comfortable enough to defeat your sister. You also slowly feel your wings grow stronger though you are not sure. Without wondering more, you decided to take on another quest.",
            choices : [
                ["The Bar", "bar"],
            ]
        },
        bar : {
            text : "You decide to head to the bar. You follow the directions on the paper leading you to the destination. When you arrive, the entrance of the bar looks run down. You enter and spot what seems to be a warrior who lays unconscious. As you move closer, the warrior awakes and spots you, he speaks in mumbles and broken language, however you do not understand him. The warriors' worn-out silver colored armour appears to have some sort of glow to them. The warrior stumbles to get up but you dare not lower your guard. You spot the warriors glowing dual-greatswords as they go towards them. They speak to you, however you only know so much. As they face you, the only thing you understand is that they said “Prepare”.",
            choices : [
                ["Fight.", "Battle.html"],
            ]
        },
    }

// THANK YOU FAST FOR HELPING ME ON THIS PART!!!!! - Dillan
function buildChoices(storyObject){
    if (storyObject.choices.length === 0) { //if the choices array is empty
        let newBtn = document.createElement('button');
            newBtn.innerText = "Begin the Adventure";
            newBtn.addEventListener('click', () => {
                startStory();
            })
        choiceCont.appendChild(newBtn);
    } else { //assume there are choices to make
        for(let choice of storyObject.choices){
            let newBtn = document.createElement('button');
            newBtn.innerText = choice[0]; // show the text in index 0
            
            newBtn.addEventListener('click', () => {
            if (choice[1].includes(".html")) {
            

                window.location.href = choice[1];
            } else {
                localStorage.setItem("fight", "Battle.html")//sets the scene to local sotrage
                myStory.push(choice[1]) // push the story key ine index 1
                console.log('Story Array', myStory); // log story array
                renderStory();
//----------------> call story render function here
            }

            })
            choiceCont.appendChild(newBtn);
        }
    }
}


function renderStory() {
    //cureent scene of the story array
    let currentScene = myStory[myStory.length - 1];
    // Empty the story and choices
    storyCont.innerHTML = "";
    choiceCont.innerHTML = "";

//This builds the story into the story array
 for (let scene of myStory) {
        let storyText = document.createElement("p");
        storyText.innerText = story[scene].text;
        storyCont.appendChild(storyText);
    }
    //Builds the buttons for the current scene the user on
    buildChoices(story[currentScene]);
}
renderStory();

</script>
</body>
</html>
