<script>

const storyCont = document.getElementById("story")
const choiceCont = document.getElementById("choices")
const myStory = ['endStory']

const story = {
        endStory : {
            text : "You and your companions determine the kingdom should be in the general area of the mountain in a couple of days. The mountain is shaped like a volcano, however there is no lava present due to the irregularities of the mountain. The plan was to create a funnel big enough to where it directs the wind into the bottom of the mountain. In response to that, it shoots all the air out of the top kinda like an air volcano. So, you and your companions head off towards the mountains after getting the necessary materials for the plan to work. After reaching the destination, you and your companions start the plan. You get there before the allotted time when the kingdom would be there to have the necessary time to commence the plan. After many hardships from the harsh winds messing up the plan the funnel is completed. However due to the wind it is not very sturdy but it will get the job done. You spend the remainder of your time with your companions before your time is up. When the allotted time came, you looked at your companions who were with you throughout your journey.",

                ["Wave Goodbye", "wave"],

                ["Leave in silence", "silence"]

        wave : {
            text : "You look at your companions and wave goodbye to them. They do the same and wish you luck on the rest of your journey. You walk back to your companions and give them a proper goodbye instead of a wave. You then go back to the cave entrance and spread your wings to catch yourself with the wind and launch out of the mountain up into the sky. You fly around a bit and discover the kingdom. You start to fly towards it.",

            text : "You look at them for the last time, without exchanging any words. No goodbyes, no happy smiles, nothing. You look at them and then towards the sky. Remembering your plan you spread your wings and leave. You get launched out of the mountain up into the sky. You fly around a bit and discover the kingdom. You start to fly towards it, however with deep regret as you did not say goodbye to your companions. Regretting how it is now too late.",

// THANK YOU FAST FOR HELPING ME ON THIS PART!!!!! - Dillan
function buildChoices(storyObject){
    if (storyObject.choices.length === 0) { //if the choices array is empty
        let newBtn = document.createElement('button');
            newBtn.innerText = "Begin the Adventure";
            newBtn.addEventListener('click', () => {
                startStory();
            })
        choiceCont.appendChild(newBtn);
    } else { //assume there are choices to make
        for(let choice of storyObject.choices){
            let newBtn = document.createElement('button');
            newBtn.innerText = choice[0]; // show the text in index 0

            newBtn.addEventListener('click', () => {
            if (choice[1].includes(".html")) {
                window.location.href = choice[1];
            } else {
                myStory.push(choice[1]) // push the story key ine index 1
                console.log('Story Array', myStory); // log story array
                renderStory();
//----------------> call story render function here
            }

            })
            choiceCont.appendChild(newBtn);
        }
    }
}


function renderStory() {
    //cureent scene of the story array
    let currentScene = myStory[myStory.length - 1];
    // Empty the story and choices
    storyCont.innerHTML = "";
    choiceCont.innerHTML = "";

//This builds the story into the story array
 for (let scene of myStory) {
        let storyText = document.createElement("p");
        storyText.innerText = story[scene].text;
        storyCont.appendChild(storyText);
    }
    //Builds the buttons for the current scene the user on
    buildChoices(story[currentScene]);
}
renderStory();



    
</script>
