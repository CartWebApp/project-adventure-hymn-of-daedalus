<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet"/>
    <title>Hymn of Daedalus</title>
</head>
<body>
    <header>Hymn of Daedalus</header>
    <section>
        <label>Aura</label>
        <progress class="Aura" value="67" max="100"></progress>
    </section>

    <!--Mid Story-->
    <section id="story"></section>
    <section id="choices"></section>
    <!--End of Midstory-->

        <section>
            <section class="Inventory"></section>
            <section class="Inventory"></section>
            <section class="Inventory"></section>
            <section class="Inventory"></section>
            <section class="Inventory"></section>
        </section>



<script>
const storyCont = document.getElementById("story")
const choiceCont = document.getElementById("choices")
const myStory = ['midStory']

const story = {
        midStory : {
            text : "You adventure off into the unknown world, passing many landmarks on the way. After many nights in the forest, you stumble upon a village full of people. You try to find a building to stay in but the language barrier and the lack of money make people drive you away. You adapt quickly and try to figure out how to learn the language of the people and find money. You look at loose papers and listen to locals reading it aloud to others. After days of learning and sleeping back in the forest, you are now able to speak bits of the language. With that out the way, you need to find money and grow stronger to defeat your sister. You see a bounty board and decide to gain strength and money there.",
            choices : [
                ["Graveyard", 'grave'],
            ]
        },
        grave : {
            text : "You decide to head to the graveyard. You follow the directions on the paper leading you to the destination. When you arrive, you do not see the bounty at first. Only a column of pillars surrounds the concrete grave in the middle. You notice shifting in one of the pillars, almost like it is breathing. It noticed that you caught on and revealed itself as the bounty. The pillar held together by the unknown ghastly features of the bounty, it prepares to engage.",
            choices : [
                ["Fight...", "Battle1.html"],
            ],
        },
        afterGrave : {
            text :"The once possessed pillar disappears and the pieces fall to the ground. With the bounty defeated, you take a piece of the broken pillar as proof. Also the other pillars were illusions and they fade away as the possessed pillar is defeated. You head back to the village and the hut next to the board awards you with 10 gold coins. With money taken care of, you still need more experience before you feel comfortable enough to defeat your sister. You also slowly feel your wings grow stronger though you are not sure. Without wondering more, you decided to take on another quest.",
            choices : [
                ["Ruined Temple", "temple"],
            ]
        },
        temple : {
            text : "You decide to head to the ruined temple. You follow the directions on the paper leading you to the destination. When you arrive, all you see around you is overly grown greenery that covers the temple walls. As you're about to enter the ruins, you hear the dragging of a sharp object coming through all the entrances. The presence of the bounty approaching does not phase you, you keep your calm and watch the entrances. As it approaches, you spot its features, a dark midnight color armour set along with a long black cape reaching his reinforced boots. His giant greatspear creates sparks on the ground as he walks. You prepare yourself for the battle ahead.",
            choices : [
                ["Fight!", "Battle2.html"],
            ],
        },
        afterTemp : {
            text : "The dark knight kneels and slowly fades away, leaving behind the armour and weapon. The armour and weapon are not in a shape where you can use for yourself. You grab the nearly broken helmet to take as proof. You head back to the village and the hut next to the board awards you with 10 gold coins. With money taken care of, you still need more experience before you feel comfortable enough to defeat your sister. You also slowly feel your wings grow stronger though you are not sure. Without wondering more, you decided to take on another quest.",
            choices : [
                ["The Bar", "bar"],
            ]
        },
        bar : {
            text : "You decide to head to the bar. You follow the directions on the paper leading you to the destination. When you arrive, the entrance of the bar looks run down. You enter and spot what seems to be a warrior who lays unconscious. As you move closer, the warrior awakes and spots you, he speaks in mumbles and broken language, however you do not understand him. The warriors' worn-out silver colored armour appears to have some sort of glow to them. The warrior stumbles to get up but you dare not lower your guard. You spot the warriors glowing dual-greatswords as they go towards them. They speak to you, however you only know so much. As they face you, the only thing you understand is that they said “Prepare”.",
            choices : [
                ["Fight.", "Battle.html"],
            ]
        },
        afterBar : {
            text : "The warrior, unable to accept defeat, goes into a flurry of rage. However, before they can do that they ultimately succumb to the injuries and falls. The warrior becomes dust and the armour and swords lose their glow. They are now worthless equipment. However, you grab the swords as proof and head out of the bar. You head back to the village and the hut next to the board awards you with 10 gold coins. With money taken care of, you still need more experience before you feel comfortable enough to defeat your sister.",
            choices : [
                ["Create Plan", "aftBounties"],
            ]
        },
        aftBounties : {
            text : "After defeating all bounties, you stay in the village for a while and learn the language completely. With your stay, you also gain some companions. You tell your companions your story and how your sister has done those corrupt deeds. With companions backing you up, and your wings strong enough are able to now fly. However you need more power and speed to reach the kingdom far in the clouds. You come up with a plan with your companions to take revenge on your sister. You remember that the kingdom does not stay in the same spot, however you do know it follows a fixed path throughout the year. You and your companions determine that the kingdom will be above a mountain famous for its strong winds. Which would be a perfect place and time to go back to the castle.",
            choices : [
                ["Begin Act 3", "act3.html"],
            ]
        },
    }

// THANK YOU FAST FOR HELPING ME ON THIS PART!!!!! - Dillan
function buildChoices(storyObject){
    if (storyObject.choices.length === 0) { //if the choices array is empty
        let newBtn = document.createElement('button');
            newBtn.innerText = "Begin the Adventure";
            newBtn.addEventListener('click', () => {
                startStory();
            })
        choiceCont.appendChild(newBtn);
    } else { //assume there are choices to make
        for(let choice of storyObject.choices){
            let newBtn = document.createElement('button');
            newBtn.innerText = choice[0]; // show the text in index 0
            
            newBtn.addEventListener('click', () => {
            if (choice[1].includes(".html")) {
            

                window.location.href = choice[1];
            } else {
                localStorage.setItem("fight", "Battle.html")//sets the scene to local sotrage
                myStory.push(choice[1]) // push the story key ine index 1
                console.log('Story Array', myStory); // log story array
                renderStory();
//----------------> call story render function here
            }

            })
            choiceCont.appendChild(newBtn);
        }
    }
}


function renderStory() {
    //cureent scene of the story array
    let currentScene = myStory[myStory.length - 1];
    // Empty the story and choices
    storyCont.innerHTML = "";
    choiceCont.innerHTML = "";

//This builds the story into the story array
 for (let scene of myStory) {
        let storyText = document.createElement("p");
        storyText.innerText = story[scene].text;
        storyCont.appendChild(storyText);
    }
    //Builds the buttons for the current scene the user on
    buildChoices(story[currentScene]);
}
renderStory();

</script>
</body>
</html>
