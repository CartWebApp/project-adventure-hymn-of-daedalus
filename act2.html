<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet"/>
    <title>Hymn of Daedalus</title>
</head>
<body>
    <header>Hymn of Daedalus</header>
    <section>
        <label>Aura</label>
        <progress class="Aura" value="67" max="100"></progress>
    </section>

    <!--Mid Story-->
    <section id="story"></section>
    <section id="choices"></section>
    <!--End of Midstory-->

        <section>
            <section class="Inventory"></section>
            <section class="Inventory"></section>
            <section class="Inventory"></section>
            <section class="Inventory"></section>
            <section class="Inventory"></section>
        </section>



<script>
const storyCont = document.getElementById("story")
const choiceCont = document.getElementById("choices")
const myStory = ['midStory']

const story = {
        midStory : {
            text : "You adventure off into the unknown world, passing many landmarks on the way. After many nights in the forest, you stumble upon a village full of people. You try to find a building to stay in but the language barrier and the lack of money make people drive you away. You adapt quickly and try to figure out how to learn the language of the people and find money. You look at loose papers and listen to locals reading it aloud to others. After days of learning and sleeping back in the forest, you are now able to speak bits of the language. With that out the way, you need to find money and grow stronger to defeat your sister. You see a bounty board and decide to gain strength and money there.",
            choices : [
                ["Graveyard", 'grave'],
            ]
        },
        grave : {
            text : "You decide to head to the graveyard. You follow the directions on the paper leading you to the destination. When you arrive, you do not see the bounty at first. Only a column of pillars surrounds the concrete grave in the middle. You notice shifting in one of the pillars, almost like it is breathing. It noticed that you caught on and revealed itself as the bounty. The pillar held together by the unknown ghastly features of the bounty, it prepares to engage.",
            choices : [
                ["Fight...", "Battle1.html"],
            ],
        },
}

// THANK YOU FAST FOR HELPING ME ON THIS PART!!!!! - Dillan
function buildChoices(storyObject){
    if (storyObject.choices.length === 0) { //if the choices array is empty
        let newBtn = document.createElement('button');
            newBtn.innerText = "Begin the Adventure";
            newBtn.addEventListener('click', () => {
                startStory();
            })
        choiceCont.appendChild(newBtn);
    } else { //assume there are choices to make
        for(let choice of storyObject.choices){
            let newBtn = document.createElement('button');
            newBtn.innerText = choice[0]; // show the text in index 0
            
            newBtn.addEventListener('click', () => {
            if (choice[1].includes(".html")) {
            

                window.location.href = choice[1];
            } else {
                localStorage.setItem("fight", "Battle.html")//sets the scene to local sotrage
                myStory.push(choice[1]) // push the story key ine index 1
                console.log('Story Array', myStory); // log story array
                renderStory();
//----------------> call story render function here
            }

            })
            choiceCont.appendChild(newBtn);
        }
    }
}


function renderStory() {
    //cureent scene of the story array
    let currentScene = myStory[myStory.length - 1];
    // Empty the story and choices
    storyCont.innerHTML = "";
    choiceCont.innerHTML = "";

//This builds the story into the story array
 for (let scene of myStory) {
        let storyText = document.createElement("p");
        storyText.innerText = story[scene].text;
        storyCont.appendChild(storyText);
    }
    //Builds the buttons for the current scene the user on
    buildChoices(story[currentScene]);
}
renderStory();

</script>
</body>
</html>
